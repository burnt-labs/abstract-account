syntax = "proto3";
package abstractaccount.v1;

import "gogoproto/gogo.proto";

option go_package = "github.com/burnt-labs/abstract-account/x/abstractaccount/types";

// Params defines the parameters for the abstractaccount module.
message Params {
  // AllowAllCodeIDs determines whether the ante handler permits a top-level
  // raw wasm MsgMigrateContract to migrate an AbstractAccount to any Wasm code
  // ID:
  // - if set to true, any code ID can be used;
  // - if set to false, only code IDs whitelisted in the AllowedCodeIDs list can
  // be used.
  bool allow_all_code_ids = 1 [(gogoproto.customname) = "AllowAllCodeIDs"];

  // AllowedCodeIDs is the ante-handler whitelist for top-level raw Wasm
  // migrations. Applications should use MsgMigrateAccount instead, which
  // selects ImplementationCodeID. This is not a wasmd-level migration policy.
  repeated uint64 allowed_code_ids = 2 [(gogoproto.customname) = "AllowedCodeIDs"];

  // MaxGasBefore is the maximum amount of gas that can be consumed by the
  // contract call in the before_tx decorator.
  //
  // Must be greater than zero.
  uint64 max_gas_before = 3;

  // MaxGasAfter is the maximum amount of gas that can be consumed by the
  // contract call in the after_tx decorator.
  //
  // Must be greater than zero.
  uint64 max_gas_after = 4;

  // BootstrapCodeID is the immutable Wasm code ID used by Instantiate2 so
  // account addresses remain stable across implementation upgrades. A zero
  // value disables account registration until governance configures it.
  uint64 bootstrap_code_id = 5 [(gogoproto.customname) = "BootstrapCodeID"];

  // ImplementationCodeID is the governance-controlled Wasm code ID new
  // accounts are migrated to immediately after deterministic instantiation.
  uint64 implementation_code_id = 6 [(gogoproto.customname) = "ImplementationCodeID"];

  // RegistrationEnabled controls whether new abstract accounts may be
  // registered. Governance can pause registration without changing the
  // immutable bootstrap address namespace or blocking existing-account
  // migrations and address queries.
  bool registration_enabled = 7;
}
